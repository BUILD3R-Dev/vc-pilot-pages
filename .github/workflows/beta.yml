name: Deploy beta
on:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: beta
    steps:
      - uses: actions/checkout@v4
      - name: Build beta site
        run: mkdir -p dist && sed "s/__SHA__/${GITHUB_SHA}/" site/index.html > dist/index.html && grep -E "Message|Footer" dist/index.html
